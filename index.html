<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Toko</title>
</head>
<body>
    <h1>Kalkulator Belanja Toko</h1>

    <label for="nama">Masukkan Nama Pembeli</label>
    <input type="text" id="nama" placeholder="Contoh : Joko##">

    <label for="harga">Masukkan Harga Satuan</label>
    <input type="number" id="harga" placeholder="Contoh : 100000">

    <label for="jumlah">Masukkan Jumlah Barang</label>
    <input type="number" id="jumlah" placeholder="Contoh : 5">

    <label for="status">Status Pembeli :</label>
    <select id="status">
        <option value="member">member</option>
        <option value="bukan bember">bukan member</option>
    </select>

    <button onclick="hitungTotal()">Hitung</button> 
    <p id="hasil"></p>

    <h2>Aturan Diskon</h2>
    <table class="table">
    <tr>
        <th>Subtotal</th>
        <td>Diskon</td>
    </tr>
    
    <tr>
        <th>Kurang dari Rp.50.000</th>
        <td>0%</td>
    </tr>

    <tr>
        <th>Rp.50.000 sampai Rp.99.999</th>
        <td>5%</td>
    </tr>

    <tr>
        <th>Rp.100.000 ke atas</th>
        <td>10%</td>
    </tr>

    <tr>
        <th>Status Member</th>
        <td>tambahan 5%</td>
    </tr>
    </table>

    <script src="script.js"></script>

</body>
</html>
